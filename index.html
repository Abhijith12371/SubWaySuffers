<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers - Runner Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.3s;
        }

        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #title {
            color: #FFD700;
            font-size: 64px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
        }

        #final-score {
            color: white;
            font-size: 32px;
            margin-bottom: 30px;
        }

        #final-score.hidden {
            display: none;
        }

        #start-btn {
            padding: 20px 50px;
            font-size: 28px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }

        #start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.4);
        }

        #start-btn:active {
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    <div id="ui">Score: 0</div>
    <div id="highscore-ui"
        style="position:absolute; top:20px; right:20px; color:white; font-size:24px; font-weight:bold; z-index:10; text-shadow:2px 2px 4px rgba(0,0,0,0.8);">
        High: 0</div>
    <div id="coin-score"
        style="position:absolute; top:60px; left:50%; transform:translateX(-50%); color:#FFD700; font-size:24px; font-weight:bold; z-index:10; text-shadow:2px 2px 4px rgba(0,0,0,0.8);">
        Coins: 0</div>

    <div id="overlay">
        <h1 id="title">RUNNER GAME</h1>
        <p id="final-score" class="hidden">Final Score: 0</p>
        <p id="best-score" style="color: #FFD700; font-size: 24px; margin-bottom: 20px;" class="hidden">Best: 0</p>
        <button id="start-btn">START</button>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
