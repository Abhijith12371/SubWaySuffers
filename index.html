<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers - Runner Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
            touch-action: none;
            user-select: none;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.3s;
        }

        #overlay.hidden {
            display: none !important;
        }

        #title {
            color: #FFD700;
            font-size: 64px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
        }

        #final-score {
            color: white;
            font-size: 32px;
            margin-bottom: 30px;
        }

        #final-score.hidden {
            display: none;
        }

        #start-btn {
            padding: 20px 50px;
            font-size: 28px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }

        #start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.4);
        }

        #start-btn:active {
            transform: translateY(-1px);
        }

        /* Loading Screen Styles */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease-out;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-title {
            color: #FFD700;
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 30px;
            text-shadow: 2px 2px 10px rgba(255, 215, 0, 0.4);
            animation: pulse 2s infinite;
        }

        .progress-container {
            width: 300px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 0 15px rgba(118, 75, 162, 0.8);
            transition: width 0.3s ease-out;
        }

        .loading-text {
            color: white;
            font-size: 14px;
            margin-top: 15px;
            font-family: 'Arial', sans-serif;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 0.8;
            }
        }
    </style>
</head>

<body>
    <div id="ui">Score: 0</div>
    <div id="highscore-ui"
        style="position:absolute; top:20px; right:20px; color:white; font-size:24px; font-weight:bold; z-index:10; text-shadow:2px 2px 4px rgba(0,0,0,0.8);">
        High: 0</div>
    <div id="coin-score"
        style="position:absolute; top:60px; left:50%; transform:translateX(-50%); color:#FFD700; font-size:24px; font-weight:bold; z-index:10; text-shadow:2px 2px 4px rgba(0,0,0,0.8);">
        Coins: 0</div>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <h2 class="loader-title">LOADING...</h2>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="load-info" class="loading-text">RESOURCES 0%</div>
    </div>

    <div id="overlay" class="hidden">
        <h1 id="title">RUNNER GAME</h1>
        <p id="final-score" class="hidden">Final Score: 0</p>
        <p id="best-score" style="color: #FFD700; font-size: 24px; margin-bottom: 20px;" class="hidden">Best: 0</p>
        <button id="start-btn">START</button>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
